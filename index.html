        .no-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .draw-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
